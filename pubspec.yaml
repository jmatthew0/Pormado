name: pormado
description: Pormado - a digital wardrobe. Digitize clothes, build outfits and plan them around Philippine weather.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: ^2.3.0
  crypto: ^3.0.5
  geolocator: '>=13.0.0 <15.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true